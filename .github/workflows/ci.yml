name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: [main]

jobs:

  rust:
    name: Rust
    runs-on: ubuntu-latest

    env:
      CARGO_TERM_COLOR: always
      # Cargo.toml pins dcs-grpc-stubs by path to ../rust-server/stubs, so the fork must be
      # checked out next to this repository. Switch this to the `v0.9.2` tag once it is published.
      RUST_SERVER_REF: hook-mechanization-api

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: rustfmt, clippy

      - name: Clone DCS-gRPC fork (path dependency for dcs-grpc-stubs)
        run: git clone --depth 1 --branch ${{ env.RUST_SERVER_REF }} https://github.com/sevenfifty777/rust-server ../rust-server

      - name: Build
        run: cargo build

      - name: Test
        run: cargo test --workspace

      - name: Lint
        run: cargo clippy -- -D warnings

      - name: Check formatting
        run: cargo fmt -- --check

  audit:
    name: Audit (non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Audit dependencies
        run: cargo audit
