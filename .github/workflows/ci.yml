name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: [main]

jobs:

  rust:
    name: Rust
    runs-on: ubuntu-latest

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # plotters -> font-kit -> yeslogic-fontconfig-sys links against system fontconfig on Linux
      # (on Windows font-kit uses DirectWrite, so this is only needed on the runner).
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev fonts-dejavu-core

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install stable toolchain
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          override: true
          components: rustfmt, clippy

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked --workspace --no-fail-fast

      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Install cargo-audit
        # 0.21.x cannot parse the CVSS 4.0 scores the RustSec database publishes since
        # September 2026 ("unsupported CVSS version: 4.0"); 0.22 is the first line that does.
        run: cargo install cargo-audit --version 0.22.2 --locked

      - name: Audit dependencies
        # cargo-audit automatically loads the reviewed ignore list from .cargo/audit.toml.
        run: cargo audit
