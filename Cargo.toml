[package]
name = "lso"
version = "0.5.0"
edition = "2021"

[dependencies]
backoff = { version = "0.4", features = ["tokio"] }
clap = { version = "4.0", features = ["derive"] }
futures-util = "0.3"
image = "0.24"
once_cell = "1.8"
pin-project = "1.0"
plotters = "0.3"
plotters-bitmap = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serenity = "0.12"
tacview = "0.2"
thiserror = "2.0"
time = { version = "0.3", features = ["local-offset", "formatting", "parsing"] }
tokio = { version = "1.2", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "signal",
    "fs",
    "sync",
] }
tonic = "0.13"
tracing = "0.1"
tracing-subscriber = "0.3"
ultraviolet = { version = "0.9", features = ["f64"] }
zip = "2.2"

[dependencies.stubs]
package = "dcs-grpc-stubs"
# Pinned to the fork release the deployed server runs. `build.rs` reads the resolved version of
# this crate back out of Cargo.lock and exposes it as `DCS_GRPC_STUBS_VERSION`, so the
# compatibility check and every report's `dcs_grpc_client_stubs` follow this pin automatically.
git = "https://github.com/sevenfifty777/rust-server.git"
tag = "v0.10.0"
features = ["client"]

[dev-dependencies]
# `test-util` gives paused virtual time to the read-budget pacing test; no extra crate.
tokio = { version = "1.2", features = ["test-util"] }
tracing-test = "0.2"
